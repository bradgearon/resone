name: Windows native builds
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.203
      - name: Build NativeAOT API, launcher, VST3 and standalone
        shell: pwsh
        run: ./scripts/build-windows.ps1 -InstallDir "$env:RUNNER_TEMP/Resone"
      - uses: actions/upload-artifact@v4
        with:
          name: Resone-win-x64
          path: ${{ runner.temp }}/Resone
